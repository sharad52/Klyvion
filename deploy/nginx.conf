# /etc/nginx/sites-available/klyvion
# Reverse proxy for klyvion.sharadbhandari.com.np -> local Docker container.
# Certbot will add the ssl_certificate lines when you run it (step 6).

limit_req_zone $binary_remote_addr zone=vf_synth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=vf_general:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name klyvion.sharadbhandari.com.np;

    client_max_body_size 20m;            # voice-sample uploads

    location /synthesize {
        limit_req zone=vf_synth burst=3 nodelay;   # CPU synthesis is expensive
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 180s;                   # CPU can take ~1 min/paragraph
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /voices {
        limit_req zone=vf_general burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=vf_general burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
