[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klyvion"
version = "0.1.0"
description = "Multi-voice text-to-speech toolkit with zero-shot voice cloning."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Klyvion Contributors" }]
requires-python = ">=3.10"
keywords = ["tts", "text-to-speech", "voice-cloning", "xtts", "speech-synthesis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    # Text normalization: expand digits to spoken words before synthesis.
    # Both are small and pure-Python; imports are still guarded so a stripped
    # install degrades to reading raw digits rather than failing.
    "num2words>=0.5.12",       # English (and other European) number words
    "indic-num2words>=1.3",    # Hindi (and other Indic) number words
]

[project.optional-dependencies]
# Neural engine with voice cloning (recommended)
neural = [
    "coqui-tts>=0.24",        # maintained fork of Coqui TTS (XTTS v2)
    # torch <2.9: from 2.9 torchaudio drops its soundfile/sox backends and routes
    # all audio IO through torchcodec, which needs a system FFmpeg + ABI-matched
    # build. Staying on 2.8 keeps audio IO pure-Python (soundfile) — needed for
    # voice cloning, which loads external audio. No system deps, Docker-friendly.
    "torch>=2.2,<2.9",
    "torchaudio>=2.2,<2.9",   # imported by coqui-tts but not declared by it
    "librosa>=0.10",
    "soundfile>=0.12",
]
# Lightweight offline fallback engine
lite = ["pyttsx3>=2.90"]
# HTTP API server (includes auth: username/password + Google OAuth)
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",     # signed session tokens (HS256)
    "bcrypt>=4.1",            # password hashing
    "authlib>=1.3",          # Google OpenID Connect / OAuth 2.0 flow
    "httpx>=0.27",           # async HTTP client Authlib uses for token exchange
    "itsdangerous>=2.1",     # Starlette SessionMiddleware (OAuth state/nonce)
    "stripe>=7",             # token-credit purchases (hosted Checkout + webhooks)
]
dev = ["pytest>=8", "pytest-cov", "ruff", "black"]
all = ["klyvion[neural,lite,server]"]

[project.scripts]
klyvion = "klyvion.cli:main"

[project.urls]
Homepage = "https://github.com/sharad52/klyvion"
Issues = "https://github.com/sharad52/klyvion/issues"

[tool.setuptools.packages.find]
include = ["klyvion*"]

[tool.setuptools.package-data]
klyvion = ["webui/*.html", "webui/*.ico"]

# PEP 735 dependency groups — used by `uv sync` for the local dev environment.
# The public install UX stays on extras above (`pip install klyvion[neural]`);
# these groups only control what a bare `uv sync` pulls into `.venv`.
[dependency-groups]
dev = ["pytest>=8", "pytest-cov", "ruff", "black", "mypy"]
# "local" = the full local environment: every engine + the server + dev tools.
local = [
    "klyvion[neural,lite,server]",
    { include-group = "dev" },
]

[tool.uv]
# A bare `uv sync` installs the full local environment (neural + server + dev).
default-groups = ["local"]
# librosa pulls numba transitively. With numpy's floor unbounded, the universal
# resolver floats numpy too high and backtracks numba to an ancient 0.53 that
# only supports Python <3.10 and fails to build. Keep numba modern; it in turn
# constrains numpy to a compatible (<2.3) range.
constraint-dependencies = [
    "numba>=0.59",
    # coqui-tts declares an unbounded transformers>=4.57 but its code imports
    # isin_mps_friendly, which was removed in transformers 5.x. Cap below 5.0.
    "transformers>=4.57,<5",
]
# Install the CPU-only torch build. The default PyPI torch pulls multi-GB CUDA
# wheels; this project runs CPU synthesis (see deploy plan), so CPU is smaller
# and faster. torch is pinned to PyTorch's CPU index below.

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
