name: Documentation
description: Report missing, unclear, or wrong documentation
title: "[docs]: "
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Where?
      placeholder: "README.md § Quick Start / docs/EXTENDING_LANGUAGES.md"
    validations: { required: true }
  - type: textarea
    id: issue
    attributes:
      label: What's wrong or missing?
    validations: { required: true }
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
